name: E2E Tests & Dashboard

# Runs the suite on every push to main, once a day on a schedule (so the
# trend history in the dashboard keeps growing even without new commits),
# and on demand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch:

# Needed so the job can commit the updated results back to the repo.
permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # continue-on-error is deliberate: a failing test run is exactly what
      # we want to capture and show on the dashboard, not silently discard.
      - name: Run Playwright tests
        run: npx playwright test --reporter=json > pw-report.json
        continue-on-error: true

      - name: Build dashboard run summary
        run: node scripts/build-run-summary.js
        env:
          RUN_LABEL: ${{ github.event_name == 'schedule' && 'Scheduled run' || format('Run — {0}', github.sha) }}

      - name: Publish updated results to the dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results
          git diff --staged --quiet || git commit -m "chore: update dashboard results [skip ci]"
          git pull --rebase origin main
          git push
